context:
  version: "2.2.14"

package:
  name: aube
  version: ${{ version }}

source:
  url: https://github.com/jdx/aube/archive/refs/tags/v${{ version }}.tar.gz
  sha256: f48fac2f7b00d85566f63484e09f4f18dc697700aab784917ae81e7870c03791

build:
  number: 0
  script:
    env:
      AUBE_PRIMER_TOP: "2000"
      AUBE_PRIMER_VERSION_CAP: "100"
      AUBE_REQUIRE_PRIMER: "1"
      AWS_LC_SYS_CMAKE_BUILDER: ${{ "1" if host_platform == "win-arm64" else "0" }} # force CMake builder for `aws-lc-sys` native C/C++ code on `win-arm64`
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
      # instruct `cc` crate to use clang-cl natively to compile build-time tools intended to be run on the host when cross-compiling from `win_64`
      AR_x86_64_pc_windows_msvc: llvm-lib
      CC_x86_64_pc_windows_msvc: clang-cl
      CXX_x86_64_pc_windows_msvc: clang-cl
    interpreter: nu
    content:
      - let prefix = $env.LIBRARY_PREFIX? | default $env.PREFIX
      # generate metadata primer, cf. https://github.com/aubepkg/aube/blob/main/.github/workflows/release.yml
      - |
        let schema = (
          open --raw crates/aube-resolver/build.rs
          | parse --regex 'const PRIMER_DATA_SCHEMA: u32 = (?<schema>\d+);'
          | get --optional 0.schema
        )

        if ($schema | is-empty) {
          error make { msg: 'Failed to parse PRIMER_DATA_SCHEMA from crates/aube-resolver/build.rs' }
        }

        node ...[
          scripts/generate-primer.mjs
          --top=($env.AUBE_PRIMER_TOP)
          --versions=($env.AUBE_PRIMER_VERSION_CAP)
          --out=($"crates/aube-resolver/data/primer-top($env.AUBE_PRIMER_TOP)-v($env.AUBE_PRIMER_VERSION_CAP)-s($schema).rkyv.json")
          --popular-names-out=crates/aube-resolver/data/popular-top100000-v1.json
        ]
      # build main app and generate license data
      - cd crates/aube
      - cargo auditable install --path=. --root=($prefix) --no-track --locked --bins --target=($env.CARGO_BUILD_TARGET)
      - cargo-bundle-licenses --format=yaml --output=../../THIRDPARTY.yml
      # generate shell completions
      - if: build_platform == host_platform
        then:
          - mkdir ($prefix)/share/bash-completion/completions ($prefix)/share/fish/vendor_completions.d ($prefix)/share/zsh/site-functions
          - let bin = ($prefix)/bin/aube
          - ^$bin completion bash | save ($prefix)/share/bash-completion/completions/aube
          - ^$bin completion fish | save ($prefix)/share/fish/vendor_completions.d/aube.fish
          - ^$bin completion zsh  | save ($prefix)/share/zsh/site-functions/_aube

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - clang
    - cmake
    - libclang
    - make
    - ninja
    - nodejs
    - nushell
    - pkg-config

tests:
  - script:
      - aube --help
      - aube --version
      - aubr --help
      - aubr --version
      - aubx --help
      - aubx --version
  - package_contents:
      bin:
        - aube
        - aubr
        - aubx
      files:
        - if: unix and build_platform == host_platform
          then:
            - share/bash-completion/completions/aube
            - share/fish/vendor_completions.d/aube.fish
            - share/zsh/site-functions/_aube
        - if: win and build_platform == host_platform
          then:
            - Library/share/bash-completion/completions/aube
            - Library/share/fish/vendor_completions.d/aube.fish
            - Library/share/zsh/site-functions/_aube
      strict: true

about:
  summary: Aube — a fast Node.js package manager
  description: |
    Aube installs automatically when you run a script. It has the tightest
    security defaults of any Node.js package manager and is the only one
    with a lifecycle-script jail. Aube drops into existing projects using
    their existing lockfiles (`pnpm-lock.yaml`, `package-lock.json`,
    `npm-shrinkwrap.json`, `yarn.lock` and `bun.lock`).
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://aube.jdx.dev
  repository: https://github.com/jdx/aube

extra:
  recipe-maintainers:
    - salim-b
